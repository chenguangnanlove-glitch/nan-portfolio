<g class="terrainFar"><path d="M-70 428l91 -88 69 49 76 -111 58 77 72 -18 79 95 91 -37 59 -64 76 69 70 -29 96 52 115 -70 72 62 96 -98 105 99v156H-70Z" fill="#673a54" opacity=".62"/><path d="M-70 477q110 -55 232 -25 140 -54 267 -3 107 -75 225 -17 143 -46 256 2 140 -58 340 3v150H-70Z" fill="#a85556" opacity=".57"/></g>
<path d="M0 487q189 -59 339 -18t329 6q185 -41 340 -15t272 9v251H0Z" fill="#a75349"/>
<path d="M0 529q124 -53 240 -38 121 24 243 12 153 -35 276 -13 159 25 264 -7 133 -22 257 29v208H0Z" fill="url(#sand)"/>
