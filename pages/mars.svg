   <path d="M891 647l21 -15 32 4 19 14 -17 9 -42 -2Z"/>
  </g>
  <g stroke="#ffcf9e" stroke-width="3.8" stroke-linecap="round" opacity=".68">
   <path d="M104 622h69 M292 586h66 M461 663h86 M645 607h77 M825 633h69"/>
  </g>
  <g fill="#5c2b3b" stroke="#e7a075" stroke-opacity=".56" stroke-width="2">
   <path d="M107 556l16 -22 27 4 12 21 -16 9 -37 -3Z"/>
