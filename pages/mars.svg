<g opacity=".56" fill="#693948"><ellipse cx="177" cy="547" rx="45" ry="9"/><ellipse cx="1014" cy="525" rx="40" ry="7"/><ellipse cx="1158" cy="578" rx="61" ry="13"/><ellipse cx="72" cy="622" rx="47" ry="11"/></g>
<g class="terrainNear"><path d="M-50 654q200 -40 368 -16 164 36 304 5 177 -41 320 -2 175 15 388 -34v113H-50Z" fill="#7e3c42" opacity=".85"/><path d="M-60 691q277 -32 499 -9 199 23 379 -4 194 -30 477 2v40H-60Z" fill="#542f3c" opacity=".75"/></g>
<!-- rock clusters -->
<g fill="#733e48" stroke="#dc805c" stroke-opacity=".34" stroke-width="3"><path d="M107 568l21 -28 28 8 17 32 -59 6Z"/><path d="M1066 572l19 -16 28 13 8 23 -63 -2Z"/><path d="M1175 614l13 -17 32 -4 15 19 -9 16h-46Z"/></g>
<!-- Fast, seamless scrolling Martian track: duplicated tiles pass underneath the bicycle. -->
<defs>
