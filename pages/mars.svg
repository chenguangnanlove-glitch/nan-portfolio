  </g>
 </g>
</defs>
<g clip-path="url(#trackClip)">
 <g>
  <use xlink:href="#trackTile" x="-960"/><use xlink:href="#trackTile" x="0"/><use xlink:href="#trackTile" x="960"/><use xlink:href="#trackTile" x="1920"/>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="2.2s" repeatCount="indefinite"/>
 </g>
</g>
