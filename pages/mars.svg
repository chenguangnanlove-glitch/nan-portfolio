<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">火星骑行者 · 鹈鹕单车动画</title>
<desc id="desc">一只戴着太空头盔的鹈鹕，骑着青绿色自行车穿过火星红色沙丘。轮胎、脚踏、双腿、围巾和飞扬的沙尘持续循环运动。</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090d23"/><stop offset=".52" stop-color="#3c2444"/><stop offset="1" stop-color="#bd6049"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#ffc493" stop-opacity=".67"/><stop offset=".4" stop-color="#ff9e80" stop-opacity=".19"/><stop offset="1" stop-color="#ff9e80" stop-opacity="0"/></radialGradient>
 <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#f4a067"/><stop offset=".52" stop-color="#a84f3d"/><stop offset="1" stop-color="#582c36"/></linearGradient>
 <linearGradient id="frame" x2="1" y2="1"><stop stop-color="#a1ffeb"/><stop offset=".48" stop-color="#39d8d3"/><stop offset="1" stop-color="#188bba"/></linearGradient>
 <linearGradient id="bird" x2="1" y2="1"><stop stop-color="#fffdf0"/><stop offset=".55" stop-color="#f0e0c5"/><stop offset="1" stop-color="#bdb4a5"/></linearGradient>
 <linearGradient id="wing" x2="1" y2="1"><stop stop-color="#f1e3c9"/><stop offset="1" stop-color="#c1a789"/></linearGradient>
 <linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffdf7d"/><stop offset=".6" stop-color="#f5a847"/><stop offset="1" stop-color="#b85a3d"/></linearGradient>
 <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f7bf8d"/><stop offset="1" stop-color="#d16e72"/></linearGradient>
 <linearGradient id="helmet" x2="1" y2="1"><stop stop-color="#d5fbff" stop-opacity=".43"/><stop offset=".6" stop-color="#7fd9f5" stop-opacity=".16"/><stop offset="1" stop-color="#8ed2eb" stop-opacity=".5"/></linearGradient>
 <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#f7ffff"/><stop offset="1" stop-color="#6d9aa5"/></linearGradient>
 <pattern id="ripples" width="115" height="29" patternUnits="userSpaceOnUse" patternTransform="skewX(-22)"><path d="M0 14q35 -9 70 -3" stroke="#ffd29d" stroke-width="2" opacity=".16" fill="none"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shadow" x="-40%" y="-60%" width="180%" height="230%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17152b" flood-opacity=".45"/></filter>
 <filter id="light"><feGaussianBlur stdDeviation="6"/></filter>
 <g id="star"><path d="M0 -4V4M-4 0H4" stroke="#fff7df" stroke-width="1.1" stroke-linecap="round"/><circle r="1.1" fill="white"/></g>
 <g id="wheel">
  <circle r="93" fill="#202634" stroke="#101b2b" stroke-width="3"/>
  <circle r="83" fill="#2c3341" stroke="#566570" stroke-width="2"/>
  <circle r="75" fill="#13222e" stroke="url(#rim)" stroke-width="5"/>
  <circle r="68" fill="#243946" stroke="#b5e7df" stroke-width="1.2" opacity=".58"/>
  <g stroke="#b7d9d6" stroke-width="1.5" opacity=".76">
   <path d="M0 -73V73 M-73 0H73 M-52 -52L52 52 M-52 52L52 -52 M-28 -67L28 67 M-67 -28L67 28 M28 -67L-28 67 M67 -28L-67 28"/>
   <circle r="12" fill="#cdece7" stroke="#396776" stroke-width="4"/>
   <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.22s" repeatCount="indefinite"/>
  </g>
  <g fill="#677d84" opacity=".75"><rect x="-3" y="-91" width="6" height="7" rx="2"/><rect x="-3" y="84" width="6" height="7" rx="2"/><rect x="84" y="-3" width="7" height="6" rx="2"/><rect x="-91" y="-3" width="7" height="6" rx="2"/></g>
 </g>
 <g id="dust"><ellipse rx="19" ry="10" fill="#ffbd86" opacity=".66"/><circle cx="19" cy="-6" r="9" fill="#f7b27e" opacity=".65"/><circle cx="-11" cy="-7" r="7" fill="#ffd7a0" opacity=".55"/></g>
 <style><![CDATA[
 .spin{transform-box:fill-box;transform-origin:center;animation:rotate 1.8s linear infinite}
 .crank{transform-origin:0px 0px;animation:rotate 1.8s linear infinite}
 .bob{animation:bob 1.8s ease-in-out infinite}
 .tail{transform-origin:0px 0px;animation:scarf .85s ease-in-out infinite alternate}
 .dust{animation:dust 2.1s ease-out infinite;transform-box:fill-box;transform-origin:center}
 .d2{animation-delay:-.7s}.d3{animation-delay:-1.4s}
 .star{animation:twinkle 2.5s ease-in-out infinite alternate}.s2{animation-delay:-1.2s}
 .terrainNear{animation:drift 11s linear infinite alternate}
 .terrainFar{animation:driftFar 19s ease-in-out infinite alternate}
 .birdLeg{fill:none;stroke:#d48a59;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
 .birdLegBack{stroke:#b77856;stroke-width:10}
 .highlight{fill:none;stroke:#fff;stroke-opacity:.7;stroke-linecap:round}
 @keyframes rotate{to{transform:rotate(360deg)}}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @keyframes scarf{0%{transform:rotate(-8deg)}100%{transform:rotate(11deg)}}
 @keyframes dust{0%{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:.8}100%{transform:translate(-170px,-36px) scale(2);opacity:0}}
 @keyframes twinkle{from{opacity:.2}to{opacity:1}}
 @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-30px)}}
 @keyframes driftFar{from{transform:translateX(-12px)}to{transform:translateX(15px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
