<rect width="1280" height="720" fill="url(#sky)"/>
<circle cx="913" cy="207" r="355" fill="url(#haze)"/>
<circle cx="919" cy="177" r="48" fill="#ffd5a4" opacity=".68" filter="url(#blur)"/>
<circle cx="919" cy="177" r="34" fill="#ffe0aa"/>
