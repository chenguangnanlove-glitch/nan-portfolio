<circle cx="1091" cy="110" r="18" fill="#d8c4c0"/><circle cx="1098" cy="105" r="6" fill="#b5a8ad" opacity=".5"/><circle cx="1041" cy="252" r="10" fill="#d6b7a4"/>
<g opacity=".8"><use xlink:href="#star" x="75" y="67" class="star"/><use xlink:href="#star" x="180" y="139" class="star s2"/><use xlink:href="#star" x="332" y="74" class="star"/><use xlink:href="#star" x="500" y="128" class="star s2"/><use xlink:href="#star" x="625" y="60" class="star"/><use xlink:href="#star" x="750" y="117" class="star s2"/><use xlink:href="#star" x="1170" y="61" class="star"/><use xlink:href="#star" x="1191" y="202" class="star s2"/><use xlink:href="#star" x="104" y="244" class="star"/><use xlink:href="#star" x="553" y="209" class="star s2"/></g>
